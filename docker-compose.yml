# Banco PostgreSQL para desenvolvimento local: docker compose up -d
services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vaca
      POSTGRES_PASSWORD: vaca
      POSTGRES_DB: vaca_amarela
    ports:
      - "5432:5432"
    volumes:
      - dados_banco:/var/lib/postgresql/data
volumes:
  dados_banco:
